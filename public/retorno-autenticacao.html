        <script>
            async function trocarCodePorToken()
            {
                const params = new URLSearchParams(window.location.search);
                const code = params.get("code");
                if(!code) return;
                /*
                const tokenResponse = await fetch("https://oauth2.googleapis.com/token", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({
                    client_id: "1016403163771-actiqtdtn7vv8sjplc4b1sk3ukns5lbm.apps.googleusercontent.com",
                    client_secret: "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",
                    code: code,
                    grant_type: "authorization_code",
                    redirect_uri: "http://localhost:81/AppCorporativa/public/retorno-autenticacao.html"
                })
                });
                */
                const params2 = new URLSearchParams();
                params2.append("code", code);
                const tokenResponse = await fetch("http://localhost:8080/AppCorporativaMavenWeb/auth/google",
                {
                    method: "POST",
                    headers: {"Content-Type": "application/x-www-form-urlencoded"},
                    body: params2,

                })
                console.log("Codigo:", code);
                const tokenData = await tokenResponse.json();
                console.log("Token recebido:", tokenData);
                const decodeToken = decodeJwt(tokenData.id_token);
                console.log("Token decodificado:", decodeToken);

                localStorage.setItem("tokenAppCorporativa", tokenData.id_token);
                
                await fetch("http://localhost:8080/AppCorporativaMavenWeb/contas/listar-por-email?email=" + decodeToken.email,
                {
                    method: "GET",
                    headers: {"Authorization": "Bearer " + tokenData.id_token},

                }).then(result =>
                {
                    console.log("Resposta da verificação do usuário:", result);
                    console.log("Status da resposta:", result.status);

                    if(result.status == 404)
                    {
                        window.location.href = "/public/conta/formulario.html?email=" + decodeToken.email;
                        return null;

                    }
                    return result.json();
                    
                }).then(conta =>
                {
                    console.log("Dados da conta:", conta);
                    if(conta == null)
                        return null;
                    localStorage.setItem("contaAppCorporativa", JSON.stringify(conta))
                    window.location.href = "/public/index.html";

                });

            }

            function decodeJwt(token)
            {
                const payload = token.split(".")[1];
                const decoded = atob(payload.replace(/-/g, "+").replace(/_/g, "/"));
                return JSON.parse(decoded);

            }

            trocarCodePorToken();
        </script>
